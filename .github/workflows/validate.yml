name: Validate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Supersede in-flight runs when a pull request is pushed again. A contributor
# rebasing a stacked series re-pushes every branch in it, which previously ran
# the full matrix to completion for each intermediate state -- 38 runs across
# five branches in one morning, and a notification for every one.
#
# Scoped to pull_request only. Pushes to master are never cancelled, because
# releases are gated on an observed successful run for the exact commit being
# tagged, and a cancelled run would break that check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull hassfest image with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 30
          command: docker pull ghcr.io/home-assistant/hassfest
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -v

  # The stub-based suite above cannot tell whether the integration loads in
  # real Home Assistant (tests/ha_stubs.py fakes the whole package). This job
  # installs the genuine one, pinned in requirements-ha-test.txt, and sets up a
  # config entry end to end with the robot I/O mocked.
  loads-in-ha:
    name: Loads in HA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - name: Install Home Assistant test harness
        run: pip install -r requirements-ha-test.txt
      - name: Load the integration in Home Assistant
        run: pytest tests_ha/ -v -p no:cacheprovider
